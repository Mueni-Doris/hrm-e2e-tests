name: Test after staging deploy

on:
  # Preferred: the app repos' deploy workflows send this event when a staging deploy finishes
  # (see DEPLOY-TRIGGER.md). Runs straight away, no polling.
  repository_dispatch:
    types: [staging-deployed]
  # Fallback poll: only runs tests when the deployed SHA changed. Remove once the dispatch is set up.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run tests even if deploy already tested'
        type: boolean
        default: false
# Staging allows one session per account: never run two suites at once with the same account.
concurrency:
  group: staging-test-account
  cancel-in-progress: false

jobs:
  check:
    name: Check for new staging deploy
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    outputs:
      new: ${{ steps.cache.outputs.cache-hit != 'true' }}
    steps:
      - id: deploy
        env:
          GH_TOKEN: ${{ secrets.APP_REPO_TOKEN }}
        run: |
          q='runs?branch=staging&status=success&per_page=1'
          FE=$(gh api "repos/Kiotapay-org/hr-app-views/actions/workflows/build_and_push.yaml/$q" --jq '.workflow_runs[0].head_sha')
          BE=$(gh api "repos/Kiotapay-org/hr-app/actions/workflows/build_and_push.yaml/$q" --jq '.workflow_runs[0].head_sha')
          echo "Frontend on staging: $FE"
          echo "Backend on staging:  $BE"
          if [ -z "$FE" ] || [ "$FE" = "null" ] || [ -z "$BE" ] || [ "$BE" = "null" ]; then
            echo "Could not read deploy SHA. Check token or branch name."; exit 1
          fi
          echo "key=$FE-$BE" >> $GITHUB_OUTPUT
          mkdir -p .marker && echo "$FE-$BE" > .marker/sha

      - id: cache
        uses: actions/cache@v4
        with:
          path: .marker
          key: tested-${{ steps.deploy.outputs.key }}

  test:
    name: Run HRM Playwright suite
    needs: check
    # Dispatch / manual runs skip the SHA check; scheduled runs need a new deploy.
    if: >-
      always() &&
      (github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' ||
       needs.check.outputs.new == 'true')
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Wait until staging serves the app
        # Replaces a fixed sleep: poll until the frontend answers quickly (deploy finished + warm).
        run: |
          URL="https://hr-app-frontend-staging.staging.kiotapay.com/login"
          for i in $(seq 1 40); do
            t=$(curl -s -o /dev/null -m 20 -w '%{http_code} %{time_total}' "$URL" || echo "000 99")
            code=${t%% *}; secs=${t##* }
            echo "attempt $i: HTTP $code in ${secs}s"
            if [ "$code" -lt 500 ] && [ "$code" != "000" ] && awk "BEGIN{exit !($secs < 10)}"; then exit 0; fi
            sleep 15
          done
          echo "Staging not ready after 10 minutes"; exit 1

      - run: npm ci

      - name: Create .env
        run: printf '%s\n' "$ENV_FILE" > .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Run tests
        run: npx playwright test
        env:
          HOME: /root

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
