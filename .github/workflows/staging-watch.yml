name: Test after staging deploy
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: # lets you run it manually too

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.cache.outputs.cache-hit != 'true' }}
    steps:
      - id: deploy
        env:
          GH_TOKEN: ${{ secrets.APP_REPO_TOKEN }}
        run: |
          q='runs?status=success&per_page=1'
          BE=$(gh api "repos/Kiotapay-org/hrm-backend/actions/workflows/DEPLOY.yml/$q" --jq '.workflow_runs[0].head_sha')
          FE=$(gh api "repos/Kiotapay-org/hrm-frontend/actions/workflows/DEPLOY.yml/$q" --jq '.workflow_runs[0].head_sha')
          echo "key=$BE-$FE" >> $GITHUB_OUTPUT
          mkdir -p .marker && echo "$BE-$FE" > .marker/sha
      - id: cache
        uses: actions/cache@v4
        with:
          path: .marker
          key: tested-${{ steps.deploy.outputs.key }}

  test:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report/ }
